; mathlean 工程配置。`mathlean check` 读这个文件；删掉也能跑（用默认值）。

[project]
; Lean 库名，与 lakefile.toml 的 [[lean_lib]] name 一致
lib = Liouville

[lean]
; Mathlib 源码目录（`lake build` 后由 Lake 放在这里；相对路径以工程根为准）
mathlib = .lake/packages/mathlib
; 公理审计文件
audit = Audit.lean

[check]
; 是否运行 lake build
build = true
; 单个步骤超时（秒）
timeout = 1800
; 是否要求 docs 下的阶段产物齐全
strict-docs = false

[axioms]
; Lean 允许依赖的公理（白名单）
allowed = propext, Classical.choice, Quot.sound
; 自定义公理必须登记，否则判为错误：登记名 = 论文中对应物
; mine = 论文引理 3.4 的假设
