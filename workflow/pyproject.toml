[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mathlean"
version = "1.0.0"
description = "数学命题求解 + Lean 4 机器验证的工作流工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fan Li" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
mathlean = "mathlean.cli:main"

[tool.setuptools]
packages = ["mathlean"]
